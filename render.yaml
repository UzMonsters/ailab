# Render Blueprint for jasScience
# After deploying, run this SQL in the database shell:
#   CREATE SCHEMA IF NOT EXISTS chemistry;

services:
  - type: web
    name: aichemistry-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: aichemistry-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: aichemistry-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aichemistry-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SEED_ENABLED
        value: "true"
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_EMAIL
        value: admin@ailab.local
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_USER_USERNAME
        value: user
      - key: SEED_USER_EMAIL
        value: user@ailab.local
      - key: SEED_USER_PASSWORD
        generateValue: true
      - key: REFRESH_COOKIE_SECURE
        value: "true"

  - type: web
    name: aichemistry-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: aichemistry-backend
          property: url
      - key: NODE_ENV
        value: production

databases:
  - name: aichemistry-db
    plan: free
    databaseName: ai_laboratory
    postgresMajorVersion: "15"
