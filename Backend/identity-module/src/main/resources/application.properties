spring.application.name=ai-laboratory-identity
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html

app.seed.enabled=false
app.security.refresh-cookie-name=${REFRESH_COOKIE_NAME:refresh_token}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

