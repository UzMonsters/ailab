spring.application.name=ai-laboratory-monolith
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Disable automatic Flyway auto-configuration
spring.flyway.enabled=false

# Render provides PORT at runtime. The fallback keeps local development on 8080.
server.port=${PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html

app.seed.enabled=false
app.security.refresh-cookie-name=${REFRESH_COOKIE_NAME:refresh_token}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.security.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
