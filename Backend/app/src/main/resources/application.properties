spring.application.name=ai-laboratory-monolith
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Disable automatic Flyway auto-configuration
spring.flyway.enabled=false

# Render provides PORT at runtime. The fallback keeps local development on 8080.
server.port=${PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html

app.seed.enabled=false
app.security.refresh-cookie-name=${REFRESH_COOKIE_NAME:refresh_token}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.security.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Strict}

# Asset and preview file storage directories
app.storage.dir=${APP_STORAGE_DIR:./storage/assets}
app.storage.preview-dir=${APP_STORAGE_PREVIEW_DIR:./storage/previews}

# Object storage. Provider can be local or s3. The legacy dir settings above remain for older code paths during migration.
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.endpoint=${APP_STORAGE_ENDPOINT:}
app.storage.region=${APP_STORAGE_REGION:us-east-1}
app.storage.bucket=${APP_STORAGE_BUCKET:ailab-local}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:}
app.storage.path-style=${APP_STORAGE_PATH_STYLE:true}
app.storage.create-bucket=${APP_STORAGE_CREATE_BUCKET:false}
app.storage.download-url-ttl=${APP_STORAGE_DOWNLOAD_URL_TTL:PT10M}
app.storage.max-asset-size=${APP_STORAGE_MAX_ASSET_SIZE:10MB}
app.storage.max-avatar-size=${APP_STORAGE_MAX_AVATAR_SIZE:2MB}
app.storage.max-preview-size=${APP_STORAGE_MAX_PREVIEW_SIZE:10MB}
app.storage.local-dir=${APP_STORAGE_LOCAL_DIR:./storage/objects}

# Mail settings
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.mail.from=${MAIL_FROM:noreply@ailab.local}
app.mail.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# OAuth2 Google Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

