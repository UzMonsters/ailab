spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-ttl=${ACCESS_TOKEN_TTL:900s}
app.security.refresh-token-ttl=${REFRESH_TOKEN_TTL:30d}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin.username=${SEED_ADMIN_USERNAME}
app.seed.admin.email=${SEED_ADMIN_EMAIL}
app.seed.admin.password=${SEED_ADMIN_PASSWORD}
app.seed.user.username=${SEED_USER_USERNAME}
app.seed.user.email=${SEED_USER_EMAIL}
app.seed.user.password=${SEED_USER_PASSWORD}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:None}
