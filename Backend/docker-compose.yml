version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ailab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ailab-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/ai_laboratory
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=Rh75eqEUdyBdTM8kMgLqIuAhJM9PLBb85e+R3O8Ag9A=
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
