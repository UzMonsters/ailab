services:
  postgres:
    image: postgres:15-alpine
    container_name: ailab-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_laboratory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./Backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ailab-network

  minio:
    image: greptime/minio:2025.4.22-debian-12-r1
    container_name: ailab-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ailab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ailab-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ailab-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ailab-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://ailab-postgres:5432/${POSTGRES_DB:-ai_laboratory}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: "8080"
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_SAME_SITE: Strict
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ailab.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-user}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@ailab.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User@12345}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:-s3}
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT:-http://ailab-minio:9000}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-ailab-assets}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:-ailab}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:-ailab-minio-password}
      APP_STORAGE_PATH_STYLE: ${APP_STORAGE_PATH_STYLE:-true}
      APP_STORAGE_CREATE_BUCKET: ${APP_STORAGE_CREATE_BUCKET:-true}
      APP_STORAGE_DOWNLOAD_URL_TTL: ${APP_STORAGE_DOWNLOAD_URL_TTL:-PT10M}
      APP_STORAGE_MAX_ASSET_SIZE: ${APP_STORAGE_MAX_ASSET_SIZE:-10MB}
      APP_STORAGE_MAX_AVATAR_SIZE: ${APP_STORAGE_MAX_AVATAR_SIZE:-2MB}
      APP_STORAGE_MAX_PREVIEW_SIZE: ${APP_STORAGE_MAX_PREVIEW_SIZE:-10MB}
      MAIL_HOST: ${MAIL_HOST:-ailab-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@ailab.local}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ailab-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: ailab-mailpit
    ports:
      - "${MAILPIT_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - ailab-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: ailab-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
    networks:
      - ailab-network

volumes:
  pgdata:
  miniodata:

networks:
  ailab-network:
    driver: bridge
